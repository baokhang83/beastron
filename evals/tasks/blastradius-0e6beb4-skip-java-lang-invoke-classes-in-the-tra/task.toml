# Replays https://github.com/baokhang83/blastradius/commit/0e6beb466271dac3c379986d4f149d1ad88ceff4
# Only the public commit is referenced; no code from the repository is stored here.
prompt = "Skip java.lang.invoke.* classes in the tracking agent's transform().\n\nRunning against a real apache/shenyu build (commit ea4f1770), the agent's\nshutdown hook crashed with ClassCircularityError on\njava/lang/invoke/MethodHandleImpl$CountingWrapper$1 before writing any\ndata. Computing a checksum in transform() (touching MessageDigest and\nConcurrentHashMap) is reentrant class-loading work happening in the\nmiddle of the JVM's own MethodHandle/invokedynamic bootstrap sequence\nfor a class shaped like this \u2014 and it raced with a second, dynamically\nself-attached javaagent (Mockito's inline mock maker attaching its own\nbyte-buddy agent at runtime) instrumenting the same machinery in the\nsame fork.\n\nThe tests in blastradius-core/src/test/java/io/github/baokhang83/blastradius/core/tracking/DependencyTrackingAgentTest.java describe what's expected. Make them pass without changing them. Check with: mvn -o -q -pl blastradius-core -am test -Dtest=DependencyTrackingAgentTest -Dsurefire.failIfNoSpecifiedTests=false"
category = "fix"
language = "java"
source = "commit-replay"
timeout = 1200
tags = ["replay"]

[workspace]
url = "https://github.com/baokhang83/blastradius"
commit = "0e6beb466271dac3c379986d4f149d1ad88ceff4"
repo = "~/Documents/blastradius"
tests = ["blastradius-core/src/test/java/io/github/baokhang83/blastradius/core/tracking/DependencyTrackingAgentTest.java"]
license = "Apache-2.0"

[[checks]]
type = "command"
run = "mvn -o -q -pl blastradius-core -am test -Dtest=DependencyTrackingAgentTest -Dsurefire.failIfNoSpecifiedTests=false"
timeout = 900

[[checks]]
type = "unchanged"
paths = ["blastradius-core/src/test/java/io/github/baokhang83/blastradius/core/tracking/DependencyTrackingAgentTest.java"]

[[checks]]
type = "only_changed"
paths = ["blastradius-core/src/main/java/io/github/baokhang83/blastradius/core/tracking/DependencyTrackingAgent.java"]
