prompt = "Accept G1 as a boost-eligible collector.\n\nCorrelatedResize rejected any JVM lacking a live soft max, which excluded G1\nunconditionally even though G1 is already fully supported on the scheduled\nshrink/grow path. The only real blocker was two calls specific to the\ncorrelated (Boost) flow: an upfront supportsSoftMax() gate, and an\nunconditional softMaxBytes() readback for preparation evidence that throws on\na collector with no soft max to read.\n\nThe tests in warden-agent/src/test/java/io/github/baokhang83/mnemo/warden/agent/intent/CorrelatedResizeTest.java describe what's expected. Make them pass without changing them. Check with: mvn -o -q -pl warden-agent -am test -Dtest=CorrelatedResizeTest -Dsurefire.failIfNoSpecifiedTests=false"
category = "feature"
language = "java"
source = "commit-replay"
timeout = 1200
