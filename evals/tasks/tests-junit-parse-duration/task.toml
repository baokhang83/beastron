prompt = "Durations.parse has no tests. Write a JUnit 5 test class for it covering hours, minutes, seconds, combinations and invalid input. Then run them with: mvn -o -q test"
category = "tests"
language = "java"
source = "synthetic"
timeout = 900
tags = ["full"]

[[checks]]
type = "command"
run = "ls src/test/java/com/example/*Test.java"

[[checks]]
type = "command"
run = "mvn -o -q test"
timeout = 300

[[checks]]
type = "command"
run = "python3 - <<'PY'\nimport pathlib, shutil, subprocess, sys, tempfile\nsource = pathlib.Path(\"src/main/java/com/example/Durations.java\")\nsrc = source.read_text()\nmutants = [(\"n * 3600\", \"n * 360\"), (\"n * 60\", \"n * 6\"), (\"throw new IllegalArgumentException\", \"return 0; //\")]\nfor old, new in mutants:\n    assert old in src, old\n    with tempfile.TemporaryDirectory() as tmp:\n        copy = pathlib.Path(tmp, \"project\")\n        shutil.copytree(\".\", copy, ignore=shutil.ignore_patterns(\"target\", \".git\"))\n        (copy / source).write_text(src.replace(old, new, 1))\n        result = subprocess.run([\"mvn\", \"-o\", \"-q\", \"test\"], cwd=copy, capture_output=True)\n        if result.returncode == 0:\n            sys.exit(f\"the tests don't catch an injected bug: {old!r} -> {new!r}\")\nPY"
timeout = 900

[[checks]]
type = "unchanged"
paths = ["src/main"]
