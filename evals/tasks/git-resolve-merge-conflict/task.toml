prompt = "Merging the feature branch into main stopped with a conflict in pricing.py. Finish the merge so that both changes are kept: the bulk discount from main and the rounding from the feature branch. Then run the tests with: python3 -m pytest -q"
category = "git"
language = "python"
source = "synthetic"
timeout = 300
tags = ["full"]

[workspace]
setup = "setup.sh"

[[checks]]
type = "not_contains"
path = "pricing.py"
text = "<<<<<<<"

[[checks]]
type = "command"
run = "python3 -m pytest -q"

[[checks]]
type = "command"
run = "test \"$(git rev-list --parents -n 1 HEAD | wc -w)\" -eq 3"

[[checks]]
type = "command"
run = "test -z \"$(git status --porcelain)\""
