# Model profiles for firox.
# Pick one with `firox --model NAME`, or `/model NAME` inside a session.
# firox looks for this file in the current folder, then ~/.config/firox/models.toml
# (or wherever FIROX_CONFIG points).

default = "qwen3-8b-local"

[models.qwen3-8b-local]
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
context = 32768  # keep in sync with OLLAMA_CONTEXT_LENGTH on the server

# Same model with thinking turned off: much faster, weaker on harder tasks.
[models.qwen3-8b-fast]
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
context = 32768
effort = "none"

