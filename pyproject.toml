[project]
name = "firox"
version = "0.1.0"
description = "A coding agent for local and open-weight models"
readme = "README.md"
authors = [
    { name = "baokhang83", email = "alex.bretet.at@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.55.1",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
firox = "firox.cli:run"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
