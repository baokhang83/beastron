name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # This job name is the required status check in main's branch protection.
    # Renaming it means updating the protection too, or PRs can't merge.
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # Python version comes from .python-version; --locked fails if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked

      # Includes the eval harness end to end (tests/test_eval_harness_e2e.py): real seed
      # tasks with a scripted model, so no model server, GPU or network is needed.
      - name: Run tests (unit tests and the eval harness with a scripted model)
        run: uv run pytest -q
